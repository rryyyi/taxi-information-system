# FareTrace 沈阳出租车透明账单归因系统 —— 归因阈值与沈阳固定计费基准
#
# 可追溯原则
#   * 阈值与沈阳计费基准集中管理，业务代码零魔法数字
#   * config_version 变更 = 归因口径变更，落库到 attributions.config_version
#   * 沈阳计费基准（shenyang_fare）为固定规则：日常归因中"计价规则变化"恒为 0 元
#
# 单位约定：金额=元（2 位小数）、距离=米、时间=秒、时间均为沈阳本地时间（UTC+8）

config_version: "cfg-sy-1.0.0"
algorithm_version: "faretrace-sy-attr-1.0.0"

money:
  unit: "yuan"
  decimals: 2
  epsilon: 0.01

# ---- 沈阳出租车固定计费基准（依据公开的沈阳出租车运价规则，哈佛引用见 docs/references.md）----
shenyang_fare:
  # 白天档：起步价 9 元/3 公里；超 3 公里后每 500 米 1 元（即 2 元/公里）
  DAY:
    base_fare: 9.00
    included_km_m: 3000
    meter_step_m: 500
    step_fare: 1.00
  # 夜间/夏季冷气档：起步价 10 元/3 公里；每 455 米 1 元
  NIGHT:
    base_fare: 10.00
    included_km_m: 3000
    meter_step_m: 455
    step_fare: 1.00
  # 夜间窗口（本地时间）
  night_window: "22:00-06:00"
  # 低速等候费高峰窗口（早 7:00—9:00，晚 16:30—18:30）
  peak_windows: ["07:00-09:00", "16:30-18:30"]
  # 阶梯返空费：超 15 公里至 20 公里部分按里程运价加收 30%；20 公里以上部分加收 50%
  return_fee:
    tier1_from_m: 15000
    tier1_to_m: 20000
    tier1_rate: 0.30
    tier2_from_m: 20000
    tier2_rate: 0.50
  # 时距并计：低速（<12km/h）时里程费照常，等候费另行叠加
  # 高峰累计每 2 分钟 1 元（120 秒/元）；平峰累计每 3 分钟 1 元（180 秒/元）
  wait_fee:
    peak_seconds_per_yuan: 120
    offpeak_seconds_per_yuan: 180

# ---- 低速等候事件识别 ----
low_speed:
  speed_threshold_kmh: 12.0     # 时速低于 12 km/h 计为低速等候
  min_wait_seconds: 20          # 连续低速段最短秒数（过滤采样噪声）
  min_moving_speed_mps: 0.3     # 低于该速度（m/s）视为停驶/蠕行

# ---- 轨迹预处理 ----
trajectory:
  MIN_POINTS: 3
  MAX_GAP_SECONDS: 180
  DUPLICATE_DISTANCE_M: 1.0
  OUTLIER_SPEED_MPS: 55.6
  FIT_BUFFER_M: 100
  FIT_THRESHOLD: 0.8
  DEVIATION_SPAN_THRESHOLD_M: 50

residual:
  ZERO_TOLERANCE: 0.01
  REVIEW_THRESHOLD: 1.0

# ---- 地图 ----
map:
  center: [41.80, 123.43]
  zoom: 12
  tile_url: "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png"
  attribution: "© OpenStreetMap contributors"
