# FareTrace 归因规则与阈值配置
#
# 可追溯原则
#   * 阈值/规则版本集中管理，业务代码中不得出现魔法数字
#   * config_version 变更 = 归因口径变更，落库到 attributions.config_version
#   * algorithm_version 变更 = 算法实现变更，需同步更新 README 验收说明
#
# 单位约定：金额=元（保留 2 位小数）、距离=米、时间=秒、速度字段标注单位

config_version: "cfg-1.0.0"
algorithm_version: "faretrace-attr-1.0.0"

money:
  unit: "yuan"
  decimals: 2
  # 归因项之和 + 残差 与 总差额 的最大允许偏差（元）
  epsilon: 0.01

trajectory:
  # 少于该点数判定轨迹缺失（data_quality = INCOMPLETE，降级计算）
  MIN_POINTS: 3
  # 相邻点时间间隔超过该值视为轨迹缺口（仍可使用，但标记 TRAJECTORY_GAP）
  MAX_GAP_SECONDS: 180
  # 相邻点距离小于该值且时间戳相同视为重复点，去重
  DUPLICATE_DISTANCE_M: 1.0
  # 相邻点隐含速度超过该值（m/s）视为明显异常点，剔除
  OUTLIER_SPEED_MPS: 55.6
  # 拟合度缓冲：fit_score = max(0, 1 - 平均偏离距离 / FIT_BUFFER_M)
  FIT_BUFFER_M: 100
  # 拟合度阈值：fit_score >= FIT_THRESHOLD 视为"基本走参考路径"
  FIT_THRESHOLD: 0.8
  # 证据用：单点偏离超过该米数时，纳入"偏离片段"证据
  DEVIATION_SPAN_THRESHOLD_M: 50

congestion:
  # 连续低速判定阈值（km/h）
  CONGESTION_SPEED_KMH: 15
  # 低速连续时段需超过该秒数才计入拥堵
  MIN_CONGESTION_SECONDS: 60
  # 低于该速度视为"停驶/等待"
  MIN_MOVING_SPEED_MPS: 0.5

residual:
  # 绝对值不超过 epsilon 的残差归零（四舍五入），并在说明中记录
  ZERO_TOLERANCE: 0.01
  # 残差绝对值超过该值，归因状态置 NEEDS_REVIEW（提示人工复核）
  REVIEW_THRESHOLD: 1.0

api:
  default_page_size: 50
