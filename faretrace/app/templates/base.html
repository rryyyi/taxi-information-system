<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}FareTrace 透明账单归因{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="logo">FareTrace</span>
    <span class="sub">网约车透明账单归因系统（课程演示 · 合成数据）</span>
  </div>
  <nav>
    <a href="/orders" class="{{ 'active' if active == 'orders' else '' }}">订单列表</a>
    <a href="/disputes/new" class="{{ 'active' if active == 'disputes' else '' }}">争议提交</a>
    <a href="/docs" target="_blank">API 文档</a>
  </nav>
</header>

<main>
{% block content %}{% endblock %}
</main>

<footer class="foot">
  <span>所有订单、轨迹、账单均为模拟/合成数据，仅用于课程演示，不含真实用户信息。</span>
  <span>配置版本 {{ config_version or 'cfg-1.0.0' }}</span>
</footer>
{% block scripts %}{% endblock %}
</body>
</html>
